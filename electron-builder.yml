appId: br.com.curtidorig.app
productName: curtidorIG
directories:
  output: release
files:
  - "electron/**/*"
  - "src/**/*"
  - "public/**/*"
  - "package.json"
  - "!**/*.test.js"
asarUnpack:
  - "node_modules/playwright/**"
mac:
  # Assinatura ad-hoc: valida a integridade do bundle, mas não substitui
  # Developer ID nem a notarização exigida pelo Gatekeeper para distribuição.
  identity: "-"
  hardenedRuntime: true
  category: public.app-category.social-networking
  target:
    - dmg
dmg:
  artifactName: curtidorIG-${version}-macOS.${ext}
