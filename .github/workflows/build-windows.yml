name: Build Windows app
# Rebuild includes latest Direct capture diagnostics

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "test/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/build-windows.yml"
      - "installer/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Download Chromium for packaging
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          npx playwright install chromium
      - name: Build Windows installer with bundled Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          npm run dist:win
      - name: Validate packaged application
        shell: pwsh
        run: |
          $required = @(
            "release/win-unpacked/resources/app.asar",
            "release/win-unpacked/resources/app.asar.unpacked",
            "release/win-unpacked/resources/playwright-browsers"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Arquivo/pasta obrigatório ausente: $path"
            }
          }
          Get-Item "release/win-unpacked/resources/app.asar" | Select-Object FullName, Length
          Get-ChildItem "release/win-unpacked/resources/app.asar.unpacked" -Force | Select-Object FullName, Mode
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build lightweight update executable
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $makensis = Join-Path $programFilesX86 "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = Join-Path $env:ProgramFiles "NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            throw "NSIS foi instalado, mas makensis.exe não foi encontrado."
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force $outputDir | Out-Null
          & $makensis "/DOUTPUT_DIR=$outputDir" /V3 "installer/windows-update.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "A geração do atualizador NSIS falhou com código $LASTEXITCODE."
          }

          $patch = Join-Path $outputDir "curtidorIG-Atualizacao-Windows.exe"
          if (-not (Test-Path $patch)) {
            throw "NSIS terminou sem erro, mas o atualizador não foi criado em: $patch"
          }
          $patchInfo = Get-Item $patch
          if ($patchInfo.Length -lt 100KB) {
            throw "O atualizador foi criado, mas o tamanho parece inválido: $($patchInfo.Length) bytes."
          }
          Write-Host "Atualizador gerado: $($patchInfo.FullName) ($($patchInfo.Length) bytes)"
      - name: Upload installer and update patch
        uses: actions/upload-artifact@v4
        with:
          name: curtidorIG-Windows-x64-${{ github.run_number }}
          path: |
            release/curtidorIG-*-Windows-Setup.exe
            release/curtidorIG-Atualizacao-Windows.exe
          if-no-files-found: error
          retention-days: 90
