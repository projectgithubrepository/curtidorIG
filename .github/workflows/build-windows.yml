name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/build-windows.yml"
      - "installer/**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Download Chromium for packaging
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          npx playwright install chromium
      - name: Build Windows installer with bundled Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$env:GITHUB_WORKSPACE\.playwright-browsers"
          npm run dist:win
      - name: Inspect packaged application files
        shell: pwsh
        run: |
          Write-Host "Conteúdo de release:"
          Get-ChildItem release -Force | Select-Object FullName, Mode
          Write-Host "Conteúdo de release/win-unpacked:"
          if (Test-Path release/win-unpacked) {
            Get-ChildItem release/win-unpacked -Force | Select-Object FullName, Mode
          } else {
            throw "A pasta release/win-unpacked não foi criada pelo electron-builder."
          }
          Write-Host "Conteúdo de resources:"
          if (Test-Path release/win-unpacked/resources) {
            Get-ChildItem release/win-unpacked/resources -Force | Select-Object FullName, Mode
          } else {
            throw "A pasta resources não foi criada."
          }
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build lightweight update executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $makensis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "$env:ProgramFiles\\NSIS\\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            throw "NSIS foi instalado, mas makensis.exe não foi encontrado nos diretórios padrão."
          }
          & $makensis /V3 installer/windows-update.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "A geração do atualizador NSIS falhou com código $LASTEXITCODE."
          }
      - name: Upload installer and update patch
        uses: actions/upload-artifact@v4
        with:
          name: curtidorIG-Windows-x64
          path: |
            release/curtidorIG-*-Windows-Setup.exe
            release/curtidorIG-Atualizacao-Windows.exe
          if-no-files-found: error
          retention-days: 30
