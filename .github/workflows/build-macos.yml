name: Build macOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium for Playwright
        run: PLAYWRIGHT_BROWSERS_PATH=playwright-browsers npx playwright install chromium
      - name: Build macOS app and DMG
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: curtidorIG-macOS-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
